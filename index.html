<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Morad - Free Kick</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <header class="top-bar">
      <div class="player-title">Morad</div>
      <div class="scoreboard">
        <div class="stat">الأهداف: <span id="goals">0</span></div>
        <div class="stat">المحاولات: <span id="shots">0</span></div>
      </div>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div id="banner" class="banner hidden">هدف!</div>
      <div class="hint">اسحب من الكرة للتصويب — وحرّك يميناً أو يساراً للفّ الكرة (Curve)</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
